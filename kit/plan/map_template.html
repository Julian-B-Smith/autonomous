     Do not edit: edit the source and rebuild. The data below is the whole map;
     nothing is fetched, nothing reads a clock, nothing is stored but the theme. -->
<style>
:root {
  --bg: #f5f6f8; --surface: #ffffff; --ink: #19202c; --muted: #5a6476; --rule: #dbe0e8;
  --accent: #2c56c9; --accent-soft: #e4ebfb; --focus: #2c56c9;
  --s-closed: #2f7d4f; --s-closed-bg: #e3f2e8;
  --s-built: #1f7a80; --s-built-bg: #dff1f2;
  --s-progress: #a3620a; --s-progress-bg: #fbeed7;
  --s-ruled: #5b4bc4; --s-ruled-bg: #ebe8fa;
  --s-planned: #4c5668; --s-planned-bg: #eceff4;
  --s-later: #7b8394; --s-later-bg: #f1f2f5;
  --s-parked: #8a8f99; --s-parked-bg: #f4f4f6;
  --s-superseded: #9aa0aa; --s-superseded-bg: #f4f4f6;
  --edge: #b7bfcc;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f131a; --surface: #161c25; --ink: #e5e9f0; --muted: #98a2b4; --rule: #29313d;
    --accent: #85a6ff; --accent-soft: #1d2a47; --focus: #85a6ff;
    --s-closed: #6cc492; --s-closed-bg: #15291e;
    --s-built: #5fc3c9; --s-built-bg: #12282a;
    --s-progress: #e2a54a; --s-progress-bg: #2c2112;
    --s-ruled: #a99cf5; --s-ruled-bg: #221e3a;
    --s-planned: #aab3c3; --s-planned-bg: #1d232d;
    --s-later: #8d96a7; --s-later-bg: #1a1f28;
    --s-parked: #7c8494; --s-parked-bg: #181c24;
    --s-superseded: #6d7483; --s-superseded-bg: #181c24;
    --edge: #3a4351;
  }
}
:root[data-theme="dark"] {
  --bg: #0f131a; --surface: #161c25; --ink: #e5e9f0; --muted: #98a2b4; --rule: #29313d;
  --accent: #85a6ff; --accent-soft: #1d2a47; --focus: #85a6ff;
  --s-closed: #6cc492; --s-closed-bg: #15291e;
  --s-built: #5fc3c9; --s-built-bg: #12282a;
  --s-progress: #e2a54a; --s-progress-bg: #2c2112;
  --s-ruled: #a99cf5; --s-ruled-bg: #221e3a;
  --s-planned: #aab3c3; --s-planned-bg: #1d232d;
  --s-later: #8d96a7; --s-later-bg: #1a1f28;
  --s-parked: #7c8494; --s-parked-bg: #181c24;
  --s-superseded: #6d7483; --s-superseded-bg: #181c24;
  --edge: #3a4351;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
.wrap { max-width: 1400px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 20px; }
header { display: grid; gap: 8px; }
h1 { font-size: 22px; line-height: 1.25; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
.sub { color: var(--muted); max-width: 72ch; margin: 0; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border: 1px solid var(--rule); border-radius: 999px;
        background: var(--surface); font-size: 13px; color: var(--ink); cursor: pointer; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.chip i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.fresh { font-size: 13px; color: var(--muted); }
.fresh b { color: var(--ink); font-weight: 600; }
button.tog { margin-left: auto; font: inherit; font-size: 13px; padding: 3px 10px; border: 1px solid var(--rule); border-radius: 6px;
             background: var(--surface); color: var(--ink); cursor: pointer; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
@media (max-width: 900px) { .main { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 16px; }
.mapbox { overflow-x: auto; overflow-y: hidden; padding: 0; }
svg { display: block; }
.node rect { stroke-width: 1.4; }
.node text { font: 12px var(--sans); fill: var(--ink); pointer-events: none; }
.node text.id { font: 10.5px var(--mono); fill: var(--muted); }
.node { cursor: pointer; }
.node:focus { outline: none; }
.node:focus rect.frame, .node.sel rect.frame { stroke: var(--focus); stroke-width: 2.5; }
.node.dim { opacity: 0.28; }
.node.crit rect.frame { stroke: var(--accent); stroke-width: 2.2; }
.node.superseded text.t { text-decoration: line-through; }
.lane text { font: 600 10.5px var(--sans); fill: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.lane line { stroke: var(--rule); }
path.e { fill: none; stroke: var(--edge); stroke-width: 1.3; }
path.e.inf { stroke-dasharray: 4 4; }
path.e.crit { stroke: var(--accent); stroke-width: 2.2; }
path.e.hot { stroke: var(--ink); stroke-width: 1.8; }
path.e.dim { opacity: 0.15; }
.side { display: grid; gap: 20px; position: sticky; top: 16px; }
@media (max-width: 900px) { .side { position: static; } }
.detail h3 { margin: 0 0 4px; font-size: 17px; line-height: 1.3; }
.detail .pid { font: 12px var(--mono); color: var(--muted); }
.detail p { margin: 8px 0; }
.detail dl { display: grid; grid-template-columns: 92px 1fr; gap: 6px 10px; margin: 12px 0 0; font-size: 13px; }
.detail dt { color: var(--muted); }
.detail dd { margin: 0; overflow-wrap: anywhere; }
.detail code, .list code { font: 12px var(--mono); }
.pill { display: inline-block; padding: 1px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; border: 1px solid; }
.list { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; font-size: 13.5px; }
.list li { padding-left: 12px; border-left: 2px solid var(--rule); }
.list li.q { border-left-color: var(--s-progress); }
.list .meta { color: var(--muted); font-size: 12px; }
a.pl { color: var(--accent); cursor: pointer; text-decoration: none; font-family: var(--mono); font-size: 12px; }
a.pl:hover, a.pl:focus { text-decoration: underline; }
.lower { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); padding: 10px 16px; border-top: 1px solid var(--rule); }
.legend svg { display: inline-block; vertical-align: middle; }
@media (prefers-reduced-motion: no-preference) { .node, path.e { transition: opacity .15s; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <p class="sub" id="about"></p>
    <div class="bar"><span class="fresh" id="fresh"></span><button class="tog" id="theme" type="button">Theme</button></div>
    <div class="bar" id="chips" role="group" aria-label="Filter by status"></div>
  </header>
  <div class="main">
    <section class="card mapbox" aria-label="Dependency map">
      <div id="map"></div>
      <div class="legend">
        <span><svg width="34" height="8"><path d="M1 4 H33" stroke="var(--edge)" stroke-width="1.4"/></svg> needs (cited)</span>
        <span><svg width="34" height="8"><path d="M1 4 H33" stroke="var(--edge)" stroke-width="1.4" stroke-dasharray="4 4"/></svg> needs (the plan's inference)</span>
        <span><svg width="34" height="8"><path d="M1 4 H33" stroke="var(--accent)" stroke-width="2.2"/></svg> critical path</span>
        <span>Left to right: a part sits right of everything it needs.</span>
      </div>
    </section>
    <aside class="side">
      <section class="card detail" id="detail" aria-live="polite"></section>
      <section class="card"><h2>Waiting on you</h2><ul class="list" id="queue"></ul></section>
    </aside>
  </div>
  <div class="lower">
    <section class="card"><h2>Critical path</h2><div id="crit"></div></section>
    <section class="card"><h2>Inconsistencies found</h2><ul class="list" id="inc"></ul></section>
  </div>
</div>
<script>
const D = /*__PLAN_DATA__*/null;
const P = D.plan, Q = D.queue, S = D.statuses;
const VAR = {"closed": "closed", "built": "built", "in progress": "progress", "ruled": "ruled",
             "planned": "planned", "later": "later", "parked": "parked", "superseded": "superseded"};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const byId = Object.fromEntries(P.parts.map(p => [p.id, p]));
const E = [];
for (const p of P.parts) {
  for (const n of p.needs || []) E.push({a: n, b: p.id, cited: true});
  for (const n of p.needs_inferred || []) E.push({a: n, b: p.id, cited: false});
}
const crit = new Set(), critE = new Set();
for (const t of Object.values(D.critical)) for (const ch of t.chains) {
  ch.forEach(id => crit.add(id));
  for (let i = 1; i < ch.length; i++) critE.add(ch[i - 1] + ">" + ch[i]);
}

// Layout: a part's column is one more than the deepest part it needs; rows
// within a column follow the track order, then the source order.
// Lanes in the plan's declared order; any track it does not name follows,
// in source order.
const tracks = (P.tracks || []).slice();
for (const p of P.parts) if (!tracks.includes(p.track || "")) tracks.push(p.track || "");
const col = {};
const depth = id => {
  if (col[id] !== undefined) return col[id];
  const p = byId[id];
  const ns = (p.needs || []).concat(p.needs_inferred || []);
  return col[id] = ns.length ? 1 + Math.max(...ns.map(depth)) : 0;
};
P.parts.forEach(p => depth(p.id));
const W = 176, H = 46, GX = 54, GY = 12, LANE = 26, PAD = 18;
const ncols = Math.max(...Object.values(col)) + 1;
const pos = {};
let y = PAD;
const lanes = [];
for (const t of tracks) {
  const inT = P.parts.filter(p => (p.track || "") === t);
  const rowsUsed = {};
  let maxRow = 0;
  for (const p of inT) {
    const c = col[p.id];
    const r = rowsUsed[c] = (rowsUsed[c] === undefined ? 0 : rowsUsed[c] + 1);
    maxRow = Math.max(maxRow, r);
    pos[p.id] = {x: PAD + c * (W + GX), y: y + LANE + r * (H + GY)};
  }
  lanes.push({t, y});
  y += LANE + (maxRow + 1) * (H + GY) + 10;
}
const width = PAD * 2 + ncols * W + (ncols - 1) * GX, height = y + PAD;

function edgePath(e) {
  const a = pos[e.a], b = pos[e.b];
  const x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x, y2 = b.y + H / 2;
  const dx = Math.max(24, (x2 - x1) / 2);
  return `M${x1} ${y1} C${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
}
function wrap(t, n) {
  const words = t.split(" "), lines = [""];
  for (const w of words) {
    if ((lines[lines.length - 1] + " " + w).trim().length > n && lines[lines.length - 1]) lines.push(w);
    else lines[lines.length - 1] = (lines[lines.length - 1] + " " + w).trim();
  }
  if (lines.length > 2) { lines.length = 2; lines[1] = lines[1].replace(/.{0,2}$/, "…"); }
  return lines;
}
let svg = `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img" aria-label="${esc(P.parts.length)} parts and their dependencies">`;
for (const l of lanes) svg += `<g class="lane"><line x1="${PAD}" x2="${width - PAD}" y1="${l.y + 6}" y2="${l.y + 6}"/><text x="${PAD}" y="${l.y + 19}">${esc(l.t)}</text></g>`;
for (const e of E) {
  const c = critE.has(e.a + ">" + e.b);
  svg += `<path class="e${e.cited ? "" : " inf"}${c ? " crit" : ""}" data-a="${e.a}" data-b="${e.b}" d="${edgePath(e)}"/>`;
}
for (const p of P.parts) {
  const {x, y} = pos[p.id], v = VAR[p.status];
  const lines = wrap(p.title, 24);
  svg += `<g class="node ${v}${crit.has(p.id) ? " crit" : ""}" data-id="${p.id}" tabindex="0" role="button" aria-label="${esc(p.title)}, ${esc(p.status)}" transform="translate(${x},${y})">`
    + `<rect class="frame" width="${W}" height="${H}" rx="4" fill="var(--s-${v}-bg)" stroke="var(--s-${v})"${p.status === "parked" ? ' stroke-dasharray="3 3"' : ""}/>`
    + `<rect width="4" height="${H}" rx="2" fill="var(--s-${v})"/>`
    + `<text class="id" x="12" y="14">${esc(p.id)}</text>`
    + lines.map((l, i) => `<text class="t" x="12" y="${29 + i * 13}">${esc(l)}</text>`).join("")
    + `</g>`;
}
$("map").innerHTML = svg + "</svg>";

// Header
$("title").textContent = P.title;
$("about").textContent = P.lede || "";
const v = P.verified || {};
$("fresh").innerHTML = `Verified <b>${esc(v.date)}</b> against ROADMAP <code>${esc(v.roadmap_commit)}</code> and DECISIONS through <b>${esc(v.decisions_max)}</b>. ROADMAP.md outranks this map.`;
const counts = Object.fromEntries(S.map(s => [s, P.parts.filter(p => p.status === s).length]));
let filter = null;
$("chips").innerHTML = S.filter(s => counts[s]).map(s =>
  `<button class="chip" type="button" data-s="${esc(s)}" aria-pressed="false"><i style="background:var(--s-${VAR[s]})"></i>${counts[s]} ${esc(s)}</button>`).join("");
$("chips").addEventListener("click", ev => {
  const b = ev.target.closest(".chip"); if (!b) return;
  filter = filter === b.dataset.s ? null : b.dataset.s;
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c.dataset.s === filter)));
  paint();
});

// Selection and details
let sel = null;
const unblocks = id => E.filter(e => e.a === id).map(e => e.b);
const plink = id => `<a class="pl" data-go="${esc(id)}" tabindex="0">${esc(id)}</a>`;
function paint() {
  const near = sel ? new Set([sel, ...E.filter(e => e.a === sel || e.b === sel).flatMap(e => [e.a, e.b])]) : null;
  document.querySelectorAll(".node").forEach(n => {
    const id = n.dataset.id;
    n.classList.toggle("sel", id === sel);
    n.classList.toggle("dim", (near && !near.has(id)) || (filter && byId[id].status !== filter));
  });
  document.querySelectorAll("path.e").forEach(p => {
    const hot = sel && (p.dataset.a === sel || p.dataset.b === sel);
    p.classList.toggle("hot", !!hot);
    p.classList.toggle("dim", !!((sel && !hot) || (filter && (byId[p.dataset.a].status !== filter && byId[p.dataset.b].status !== filter))));
  });
}
function show(id) {
  sel = id; paint();
  const p = byId[id];
  if (!p) { $("detail").innerHTML = `<h2>Part</h2><p class="sub">Select a part on the map to see what governs it.</p>`; return; }
  const v = VAR[p.status];
  const q = (Q.items || []).filter(i => (i.blocks || []).includes(id));
  const row = (k, val) => val ? `<dt>${k}</dt><dd>${val}</dd>` : "";
  $("detail").innerHTML = `<h2>Part</h2><div class="pid">${esc(p.id)}${p.track ? " · " + esc(p.track) : ""}</div><h3>${esc(p.title)}</h3>`
    + `<span class="pill" style="color:var(--s-${v});border-color:var(--s-${v});background:var(--s-${v}-bg)">${esc(p.status)}</span>`
    + `<p>${esc(p.what)}</p>${p.note ? `<p class="sub">${esc(p.note)}</p>` : ""}<dl>`
    + row("ROADMAP", (p.rows || []).map(r => `<code>${esc(r)}</code>`).join(", "))
    + row("Decisions", (p.adrs || []).map(a => `<code>D${esc(a)}</code>`).join(", "))
    + row("Status basis", (p.basis || []).map(b => `<code>${esc(b)}</code>`).join(", "))
    + row("Code", (p.code || []).map(c => `<code>${esc(c)}</code>`).join(", "))
    + row("Needs", (p.needs || []).map(plink).concat((p.needs_inferred || []).map(n => plink(n) + "?")).join(", "))
    + row("Unblocks", unblocks(id).map(plink).join(", "))
    + row("Waiting on you", q.map(i => `<code>${esc(i.id)}</code>`).join(", "))
    + `</dl>`;
  try { history.replaceState(null, "", "#" + encodeURIComponent(id)); } catch (e) {}
}
document.addEventListener("click", ev => {
  const n = ev.target.closest(".node"), a = ev.target.closest("[data-go]");
  if (n) show(n.dataset.id === sel ? null : n.dataset.id);
  else if (a) show(a.dataset.go);
});
document.addEventListener("keydown", ev => {
  if (ev.key !== "Enter" && ev.key !== " ") return;
  const n = ev.target.closest && (ev.target.closest(".node") || ev.target.closest("[data-go]"));
  if (!n) return;
  ev.preventDefault(); show(n.dataset.id || n.dataset.go);
});

// Lower panels
$("queue").innerHTML = (Q.items || []).length ? Q.items.slice().sort((a, b) => (a.raised + a.id).localeCompare(b.raised + b.id)).map(i =>
  `<li class="q"><div><b>${esc(i.question)}</b></div><div>Recommendation: ${esc(i.recommendation)}</div>`
  + `<div class="meta">${esc(i.id)} · raised ${esc(i.raised)} · lands in ${esc(i.lands_in)}${(i.blocks || []).length ? " · blocks " + i.blocks.map(plink).join(", ") : ""}</div></li>`).join("")
  : `<li>Nothing is waiting on you.</li>`;
$("crit").innerHTML = Object.entries(D.critical).map(([t, c]) =>
  `<p>To ${plink(t)}: <b>${c.length}</b> unfinished part${c.length === 1 ? "" : "s"}${c.chains.length > 1 ? `, ${c.chains.length} tied chains` : ""}.</p>`
  + c.chains.map(ch => `<p class="sub">${ch.map(plink).join(" → ")}</p>`).join("")).join("") || `<p class="sub">No targets named.</p>`;
const inc = (P.inconsistencies || []).concat((D.ahead || []).map(a => a + " (computed)"));
$("inc").innerHTML = inc.length ? inc.map(i => `<li>${esc(i).replace(/`([^`]+)`/g, "<code>$1</code>")}</li>`).join("") : "<li>None.</li>";

// Theme: the system's by default; the toggle is a per-viewer convenience.
const root = document.documentElement;
try { const t = localStorage.getItem("plan-map-theme"); if (t) root.dataset.theme = t; } catch (e) {}
$("theme").addEventListener("click", () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("plan-map-theme", root.dataset.theme); } catch (e) {}
});
const start = decodeURIComponent(location.hash.slice(1));
show(byId[start] ? start : null);
</script>
</body>
</html>
