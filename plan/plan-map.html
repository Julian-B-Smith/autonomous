", "title": "Supply chain and settings checklists", "track": "Security (S)", "what": "Checklists and a pentest runbook."}, {"adrs": [51], "id": "r", "needs": ["k0", "k1", "k2", "k3", "k4", "k5"], "rows": ["Phase R"], "status": "planned", "title": "Recursive VSM frame", "track": "Frame and later", "what": "What is invariant at every level and what is per level; written from K0–K5's material."}, {"adrs": [73], "basis": ["D73"], "id": "messaging", "rows": ["Live agent-to-agent messaging"], "status": "parked", "title": "Live agent-to-agent messaging", "track": "Frame and later", "what": "Excluded at this scale; revisit only if the task ledger cannot express a needed interaction."}], "repo": "autonomous", "status_meaning": {"built": "Exists and is tested; its gate is not yet recorded as met.", "closed": "Built, and its gate is recorded as met.", "in progress": "Work under way, or partly built.", "later": "Deferred until a stated condition.", "parked": "Tabled by a ruling.", "planned": "In ROADMAP; not ratified in detail and not started.", "ruled": "Ratified by the human; not started.", "superseded": "Replaced by another part before it was done."}, "targets": ["p4"], "title": "autonomous plan map", "tracks": ["Build sequence (rung 3)", "Kit currency (K)", "Session oversight (O)", "Harness-owned actions (A)", "Security (S)", "Human TODO surface (T)", "VSM amendments", "Frame and later"], "verified": {"date": "2026-10-17", "decisions_max": 101, "roadmap_commit": "2340f5e"}}, "queue": {"format": "kit.queue/0", "items": [{"blocks": ["c0", "p0"], "id": "c0-spine", "lands_in": "DECISIONS.md, then the ROADMAP C0 marker", "question": "Is Phase C0 closed, and is P0 to P4 (the organ fleet) still the roadmap's spine?", "raised": "2026-10-17", "recommendation": "Run the dedup sweep; if clean, close C0. Keep P0 to P4 as the long-range rung-3 track, and move the current-phase marker to where the work is (Phase O and A)."}, {"blocks": ["t2", "queue"], "id": "t2-queue", "lands_in": "DECISIONS.md", "question": "Is T2 superseded by the decision queue of Decision 90?", "raised": "2026-10-17", "recommendation": "Yes. Mark T2 superseded by `queue`, and have T0 read the queue files rather than invent a field."}, {"blocks": ["o06"], "id": "clean-branch", "lands_in": "DECISIONS.md (Decision 92's follow-up)", "question": "May a clean, pushed branch that was never verified in its checkout stop without running verify?", "raised": "2026-10-10", "recommendation": "Decide on the observe week's counts of `clean` and `pushed` stop-gate events, as Decision 92 ruled."}, {"blocks": ["o2"], "id": "interrupt-channel", "lands_in": "DECISIONS.md (Structural Caution §5.1)", "question": "Which channel carries interrupts to you?", "raised": "2026-09-26", "recommendation": "The LifeOS channel, if it can push to your phone, so alarms land where the dashboard will; otherwise a chat webhook."}, {"blocks": ["o1"], "id": "thresholds", "lands_in": "DECISIONS.md (Structural Caution §5.2)", "question": "Start the oversight budgets from the packet's table, or from a month of git history?", "raised": "2026-09-26", "recommendation": "Derive them from the last month of history, with the packet's table as the ceiling."}, {"blocks": ["k3", "o4"], "id": "registry-home", "lands_in": "DECISIONS.md (K3 gate; Structural Caution §5.4)", "question": "Do the session registry and the dashboard data stay under ~/.claude on each machine, or move to the private repo both machines pull?", "raised": "2026-08-17", "recommendation": "Stay under ~/.claude until O4; move when the second machine needs them."}]}, "statuses": ["closed", "built", "in progress", "ruled", "planned", "later", "parked", "superseded"]};
const P = D.plan, Q = D.queue, S = D.statuses;
const VAR = {"closed": "closed", "built": "built", "in progress": "progress", "ruled": "ruled",
             "planned": "planned", "later": "later", "parked": "parked", "superseded": "superseded"};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const byId = Object.fromEntries(P.parts.map(p => [p.id, p]));
const E = [];
for (const p of P.parts) {
  for (const n of p.needs || []) E.push({a: n, b: p.id, cited: true});
  for (const n of p.needs_inferred || []) E.push({a: n, b: p.id, cited: false});
}
const crit = new Set(), critE = new Set();
for (const t of Object.values(D.critical)) for (const ch of t.chains) {
  ch.forEach(id => crit.add(id));
  for (let i = 1; i < ch.length; i++) critE.add(ch[i - 1] + ">" + ch[i]);
}

// Layout: a part's column is one more than the deepest part it needs; rows
// within a column follow the track order, then the source order.
// Lanes in the plan's declared order; any track it does not name follows,
// in source order.
const tracks = (P.tracks || []).slice();
for (const p of P.parts) if (!tracks.includes(p.track || "")) tracks.push(p.track || "");
const col = {};
const depth = id => {
  if (col[id] !== undefined) return col[id];
  const p = byId[id];
  const ns = (p.needs || []).concat(p.needs_inferred || []);
  return col[id] = ns.length ? 1 + Math.max(...ns.map(depth)) : 0;
};
P.parts.forEach(p => depth(p.id));
const W = 176, H = 46, GX = 54, GY = 12, LANE = 26, PAD = 18;
const ncols = Math.max(...Object.values(col)) + 1;
const pos = {};
let y = PAD;
const lanes = [];
for (const t of tracks) {
  const inT = P.parts.filter(p => (p.track || "") === t);
  const rowsUsed = {};
  let maxRow = 0;
  for (const p of inT) {
    const c = col[p.id];
    const r = rowsUsed[c] = (rowsUsed[c] === undefined ? 0 : rowsUsed[c] + 1);
    maxRow = Math.max(maxRow, r);
    pos[p.id] = {x: PAD + c * (W + GX), y: y + LANE + r * (H + GY)};
  }
  lanes.push({t, y});
  y += LANE + (maxRow + 1) * (H + GY) + 10;
}
const width = PAD * 2 + ncols * W + (ncols - 1) * GX, height = y + PAD;

function edgePath(e) {
  const a = pos[e.a], b = pos[e.b];
  const x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x, y2 = b.y + H / 2;
  const dx = Math.max(24, (x2 - x1) / 2);
  return `M${x1} ${y1} C${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
}
function wrap(t, n) {
  const words = t.split(" "), lines = [""];
  for (const w of words) {
    if ((lines[lines.length - 1] + " " + w).trim().length > n && lines[lines.length - 1]) lines.push(w);
    else lines[lines.length - 1] = (lines[lines.length - 1] + " " + w).trim();
  }
  if (lines.length > 2) { lines.length = 2; lines[1] = lines[1].replace(/.{0,2}$/, "…"); }
  return lines;
}
let svg = `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img" aria-label="${esc(P.parts.length)} parts and their dependencies">`;
for (const l of lanes) svg += `<g class="lane"><line x1="${PAD}" x2="${width - PAD}" y1="${l.y + 6}" y2="${l.y + 6}"/><text x="${PAD}" y="${l.y + 19}">${esc(l.t)}</text></g>`;
for (const e of E) {
  const c = critE.has(e.a + ">" + e.b);
  svg += `<path class="e${e.cited ? "" : " inf"}${c ? " crit" : ""}" data-a="${e.a}" data-b="${e.b}" d="${edgePath(e)}"/>`;
}
for (const p of P.parts) {
  const {x, y} = pos[p.id], v = VAR[p.status];
  const lines = wrap(p.title, 24);
  svg += `<g class="node ${v}${crit.has(p.id) ? " crit" : ""}" data-id="${p.id}" tabindex="0" role="button" aria-label="${esc(p.title)}, ${esc(p.status)}" transform="translate(${x},${y})">`
    + `<rect class="frame" width="${W}" height="${H}" rx="4" fill="var(--s-${v}-bg)" stroke="var(--s-${v})"${p.status === "parked" ? ' stroke-dasharray="3 3"' : ""}/>`
    + `<rect width="4" height="${H}" rx="2" fill="var(--s-${v})"/>`
    + `<text class="id" x="12" y="14">${esc(p.id)}</text>`
    + lines.map((l, i) => `<text class="t" x="12" y="${29 + i * 13}">${esc(l)}</text>`).join("")
    + `</g>`;
}
$("map").innerHTML = svg + "</svg>";

// Header
$("title").textContent = P.title;
$("about").textContent = P.lede || "";
const v = P.verified || {};
$("fresh").innerHTML = `Verified <b>${esc(v.date)}</b> against ROADMAP <code>${esc(v.roadmap_commit)}</code> and DECISIONS through <b>${esc(v.decisions_max)}</b>. ROADMAP.md outranks this map.`;
const counts = Object.fromEntries(S.map(s => [s, P.parts.filter(p => p.status === s).length]));
let filter = null;
$("chips").innerHTML = S.filter(s => counts[s]).map(s =>
  `<button class="chip" type="button" data-s="${esc(s)}" aria-pressed="false"><i style="background:var(--s-${VAR[s]})"></i>${counts[s]} ${esc(s)}</button>`).join("");
$("chips").addEventListener("click", ev => {
  const b = ev.target.closest(".chip"); if (!b) return;
  filter = filter === b.dataset.s ? null : b.dataset.s;
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c.dataset.s === filter)));
  paint();
});

// Selection and details
let sel = null;
const unblocks = id => E.filter(e => e.a === id).map(e => e.b);
const plink = id => `<a class="pl" data-go="${esc(id)}" tabindex="0">${esc(id)}</a>`;
function paint() {
  const near = sel ? new Set([sel, ...E.filter(e => e.a === sel || e.b === sel).flatMap(e => [e.a, e.b])]) : null;
  document.querySelectorAll(".node").forEach(n => {
    const id = n.dataset.id;
    n.classList.toggle("sel", id === sel);
    n.classList.toggle("dim", (near && !near.has(id)) || (filter && byId[id].status !== filter));
  });
  document.querySelectorAll("path.e").forEach(p => {
    const hot = sel && (p.dataset.a === sel || p.dataset.b === sel);
    p.classList.toggle("hot", !!hot);
    p.classList.toggle("dim", !!((sel && !hot) || (filter && (byId[p.dataset.a].status !== filter && byId[p.dataset.b].status !== filter))));
  });
}
function show(id) {
  sel = id; paint();
  const p = byId[id];
  if (!p) { $("detail").innerHTML = `<h2>Part</h2><p class="sub">Select a part on the map to see what governs it.</p>`; return; }
  const v = VAR[p.status];
  const q = (Q.items || []).filter(i => (i.blocks || []).includes(id));
  const row = (k, val) => val ? `<dt>${k}</dt><dd>${val}</dd>` : "";
  $("detail").innerHTML = `<h2>Part</h2><div class="pid">${esc(p.id)}${p.track ? " · " + esc(p.track) : ""}</div><h3>${esc(p.title)}</h3>`
    + `<span class="pill" style="color:var(--s-${v});border-color:var(--s-${v});background:var(--s-${v}-bg)">${esc(p.status)}</span>`
    + `<p>${esc(p.what)}</p>${p.note ? `<p class="sub">${esc(p.note)}</p>` : ""}<dl>`
    + row("ROADMAP", (p.rows || []).map(r => `<code>${esc(r)}</code>`).join(", "))
    + row("Decisions", (p.adrs || []).map(a => `<code>D${esc(a)}</code>`).join(", "))
    + row("Status basis", (p.basis || []).map(b => `<code>${esc(b)}</code>`).join(", "))
    + row("Code", (p.code || []).map(c => `<code>${esc(c)}</code>`).join(", "))
    + row("Needs", (p.needs || []).map(plink).concat((p.needs_inferred || []).map(n => plink(n) + "?")).join(", "))
    + row("Unblocks", unblocks(id).map(plink).join(", "))
    + row("Waiting on you", q.map(i => `<code>${esc(i.id)}</code>`).join(", "))
    + `</dl>`;
  try { history.replaceState(null, "", "#" + encodeURIComponent(id)); } catch (e) {}
}
document.addEventListener("click", ev => {
  const n = ev.target.closest(".node"), a = ev.target.closest("[data-go]");
  if (n) show(n.dataset.id === sel ? null : n.dataset.id);
  else if (a) show(a.dataset.go);
});
document.addEventListener("keydown", ev => {
  if (ev.key !== "Enter" && ev.key !== " ") return;
  const n = ev.target.closest && (ev.target.closest(".node") || ev.target.closest("[data-go]"));
  if (!n) return;
  ev.preventDefault(); show(n.dataset.id || n.dataset.go);
});

// Lower panels
$("queue").innerHTML = (Q.items || []).length ? Q.items.slice().sort((a, b) => (a.raised + a.id).localeCompare(b.raised + b.id)).map(i =>
  `<li class="q"><div><b>${esc(i.question)}</b></div><div>Recommendation: ${esc(i.recommendation)}</div>`
  + `<div class="meta">${esc(i.id)} · raised ${esc(i.raised)} · lands in ${esc(i.lands_in)}${(i.blocks || []).length ? " · blocks " + i.blocks.map(plink).join(", ") : ""}</div></li>`).join("")
  : `<li>Nothing is waiting on you.</li>`;
$("crit").innerHTML = Object.entries(D.critical).map(([t, c]) =>
  `<p>To ${plink(t)}: <b>${c.length}</b> unfinished part${c.length === 1 ? "" : "s"}${c.chains.length > 1 ? `, ${c.chains.length} tied chains` : ""}.</p>`
  + c.chains.map(ch => `<p class="sub">${ch.map(plink).join(" → ")}</p>`).join("")).join("") || `<p class="sub">No targets named.</p>`;
const inc = (P.inconsistencies || []).concat((D.ahead || []).map(a => a + " (computed)"));
$("inc").innerHTML = inc.length ? inc.map(i => `<li>${esc(i).replace(/`([^`]+)`/g, "<code>$1</code>")}</li>`).join("") : "<li>None.</li>";

// Theme: the system's by default; the toggle is a per-viewer convenience.
const root = document.documentElement;
try { const t = localStorage.getItem("plan-map-theme"); if (t) root.dataset.theme = t; } catch (e) {}
$("theme").addEventListener("click", () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("plan-map-theme", root.dataset.theme); } catch (e) {}
});
const start = decodeURIComponent(location.hash.slice(1));
show(byId[start] ? start : null);
</script>
